<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Screen Recorder</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f4f4f4; }
        .controls button { margin: 10px; padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 5px; transition: background-color 0.3s; }
        #startButton { background-color: #4CAF50; color: white; }
        #startButton:hover { background-color: #45a049; }
        #stopButton { background-color: #f44336; color: white; }
        #stopButton:hover { background-color: #da190b; }
        #pauseButton, #resumeButton { background-color: #008CBA; color: white; }
        #pauseButton:hover, #resumeButton:hover { background-color: #007bb5; }
        #downloadLink { display: none; margin-top: 20px; padding: 10px 20px; background-color: #555; color: white; text-decoration: none; border-radius: 5px; }
        #status { margin-top: 20px; font-size: 1.2em; color: #333; }
        #videoPreview { border: 1px solid #ccc; margin-top: 20px; max-width: 80%; height: auto; display: none; }
        .mic-controls select, .mic-controls button { padding: 8px 12px; font-size: 1em; border-radius: 5px; border: 1px solid #ccc; }
        #micMuteButton { background-color: #ff9800; color: white; border: none; cursor: pointer; }
        #micMuteButton:hover:not(:disabled) { background-color: #fb8c00; }
        #micMuteButton:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        #requestMicButton { background-color: #008CBA; color: white; padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 5px; }
        #requestMicButton:hover { background-color: #007bb5; }
    </style>
</head>
<body>
    <h1>Local Screen Recorder</h1>
    <button id="requestMicButton">Grant Microphone Access</button>
    <div id="recorderControls" style="display: none; text-align: center; width: 100%;">
        <div class="controls">
            <button id="startButton">Start Recording</button>
            <button id="pauseButton" disabled>Pause</button>
            <button id="resumeButton" disabled>Resume</button>
            <button id="stopButton" disabled>Stop Recording</button>
        </div>
        <div class="mic-controls" style="margin-top: 10px; display: inline-flex; align-items: center; gap: 10px;">
            <select id="audioDeviceSelect" title="Select microphone"></select>
            <button id="micMuteButton" disabled>Mute Mic</button>
        </div>
    </div>
    <video id="videoPreview" autoplay muted></video>
    <a id="downloadLink" href="#" download="my-screen-recording.webm">Download Video</a>
    <p id="status"></p>

    <script>
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const pauseButton = document.getElementById('pauseButton');
        const resumeButton = document.getElementById('resumeButton');
        const downloadLink = document.getElementById('downloadLink');
        const statusDiv = document.getElementById('status');
        const videoPreview = document.getElementById('videoPreview');
        const audioDeviceSelect = document.getElementById('audioDeviceSelect');
        const micMuteButton = document.getElementById('micMuteButton');
        const requestMicButton = document.getElementById('requestMicButton');
        const recorderControls = document.getElementById('recorderControls');

        let mediaRecorder;
        let recordedChunks = [];
        let displayStream;
        let micStream;
        let mixedStream;
        let audioContext;

        // Function to update button states
        function updateButtons(recording = false, paused = false) {
            startButton.disabled = recording;
            stopButton.disabled = !recording;
            pauseButton.disabled = !recording || paused;
            resumeButton.disabled = !recording || !paused;
            micMuteButton.disabled = !recording || !micStream; // Disable if no mic stream
            audioDeviceSelect.disabled = recording;
        }

        // Initial button state
        updateButtons(false);

        requestMicButton.addEventListener('click', async () => {
            requestMicButton.disabled = true;
            statusDiv.textContent = 'Requesting microphone access...';
            try {
                // Request access to get the device list with labels
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // We don't need this stream now, so stop it.
                stream.getTracks().forEach(track => track.stop());

                await populateAudioDevices();
                // Listen for device changes from now on
                navigator.mediaDevices.ondevicechange = populateAudioDevices;

                requestMicButton.style.display = 'none';
                recorderControls.style.display = 'block';
                statusDiv.textContent = 'Ready. Select your microphone and start recording.';
            } catch (err) {
                console.error('Error getting microphone permission:', err);
                statusDiv.textContent = `Could not get microphone permission: ${err.name}. Please check your browser settings.`;
                requestMicButton.disabled = false;
            }
        });

        async function populateAudioDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioDevices = devices.filter(device => device.kind === 'audioinput');
                
                const currentSelection = audioDeviceSelect.value;
                audioDeviceSelect.innerHTML = ''; // Clear existing options
                
                audioDevices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Microphone ${audioDeviceSelect.length + 1}`;
                    audioDeviceSelect.appendChild(option);
                });
                
                // Add option for no microphone
                const noMicOption = document.createElement('option');
                noMicOption.value = 'none';
                noMicOption.text = 'No Microphone';
                audioDeviceSelect.appendChild(noMicOption);
                
                // Restore selection if possible, otherwise default to 'none'
                if (Array.from(audioDeviceSelect.options).some(o => o.value === currentSelection)) {
                    audioDeviceSelect.value = currentSelection;
                } else {
                    audioDeviceSelect.value = 'none';
                }

            } catch (err) {
                console.error('Could not enumerate audio devices:', err);
                audioDeviceSelect.innerHTML = '<option value="none">Could not access microphones</option>';
            }
        }
        

        micMuteButton.addEventListener('click', () => {
            if (!micStream) return;
            const micTrack = micStream.getAudioTracks()[0];
            if (micTrack) {
                micTrack.enabled = !micTrack.enabled;
                micMuteButton.textContent = micTrack.enabled ? 'Mute Mic' : 'Unmute Mic';
            }
        });

        startButton.addEventListener('click', async () => {
            recordedChunks = [];
            micStream = null; // Reset mic stream
            downloadLink.style.display = 'none';
            statusDiv.textContent = 'Awaiting permission...';
            videoPreview.style.display = 'none';

            try {
                const selectedAudioDeviceId = audioDeviceSelect.value;
                if (selectedAudioDeviceId !== 'none') {
                    // First, get the microphone stream. This will trigger permissions.
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: { deviceId: { exact: selectedAudioDeviceId } }
                    });
                    // With permission, we can now get accurate device labels.
                    await populateAudioDevices();
                    // Restore selection, since the list was rebuilt.
                    audioDeviceSelect.value = selectedAudioDeviceId;
                }

                // Get screen and tab audio
                displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: "always",
                        displaySurface: "browser",
                    },
                    audio: {
                        // High-quality tab audio
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    },
                });
                
                const tracks = [...displayStream.getVideoTracks()];
                const tabAudioTracks = displayStream.getAudioTracks();
                const micAudioTracks = micStream ? micStream.getAudioTracks() : [];

                if (micAudioTracks.length > 0 && tabAudioTracks.length > 0) {
                    audioContext = new AudioContext();
                    const destination = audioContext.createMediaStreamDestination();
                    
                    const tabSource = audioContext.createMediaStreamSource(new MediaStream([tabAudioTracks[0]]));
                    tabSource.connect(destination);

                    const micSource = audioContext.createMediaStreamSource(new MediaStream([micAudioTracks[0]]));
                    micSource.connect(destination);

                    tracks.push(destination.stream.getAudioTracks()[0]);
                } else if (tabAudioTracks.length > 0) {
                    tracks.push(tabAudioTracks[0]);
                } else if (micAudioTracks.length > 0) {
                    tracks.push(micAudioTracks[0]);
                }
                
                mixedStream = new MediaStream(tracks);

                // Preview the screen, but without audio to prevent feedback
                videoPreview.srcObject = displayStream;
                videoPreview.style.display = 'block';

                mediaRecorder = new MediaRecorder(mixedStream, {
                    mimeType: 'video/webm;codecs=vp9,opus', // Use VP9 for better quality
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, {
                        type: 'video/webm'
                    });
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.style.display = 'block';
                    statusDiv.textContent = 'Recording finished. Click to download.';

                    // Stop all tracks from all streams
                    displayStream.getTracks().forEach(track => track.stop());
                    if (micStream) {
                        micStream.getTracks().forEach(track => track.stop());
                    }
                    if (audioContext) {
                        audioContext.close();
                    }

                    videoPreview.srcObject = null;
                    updateButtons(false);
                };

                mediaRecorder.onpause = () => {
                    statusDiv.textContent = 'Recording paused.';
                    updateButtons(true, true);
                };

                mediaRecorder.onresume = () => {
                    statusDiv.textContent = 'Recording resumed.';
                    updateButtons(true, false);
                };

                mediaRecorder.start();
                statusDiv.textContent = 'Recording...';
                micMuteButton.textContent = 'Mute Mic';
                updateButtons(true, false);

            } catch (err) {
                console.error('Error starting recording:', err);
                let message = `Error starting recording: ${err.name} - ${err.message}`;
                if (err.name === 'NotAllowedError') {
                    message = 'Permission to access screen was denied. Please try again and allow access.';
                } else if (err.name === 'NotFoundError') {
                    message = 'No display media found. Please ensure you have a screen to share.';
                }
                statusDiv.textContent = message;
                updateButtons(false);
                // Also clean up any partial streams
                if (displayStream) displayStream.getTracks().forEach(track => track.stop());
                if (micStream) micStream.getTracks().forEach(track => track.stop());
            }
        });

        pauseButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
            }
        });

        resumeButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
            }
        });

        stopButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        });
    </script>
</body>
</html>
