<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Screen Recorder</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f4f4f4; }
        .controls button { margin: 10px; padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 5px; transition: background-color 0.3s; }
        #startButton { background-color: #4CAF50; color: white; }
        #startButton:hover { background-color: #45a049; }
        #stopButton { background-color: #f44336; color: white; }
        #stopButton:hover { background-color: #da190b; }
        #changeSourceButton { background-color: #2196F3; color: white; } /* Blue */
        #changeSourceButton:hover:not(:disabled) { background-color: #0b7dda; }
        #changeSourceButton:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        #pauseButton, #resumeButton { background-color: #008CBA; color: white; }
        #pauseButton:hover, #resumeButton:hover { background-color: #007bb5; }
        #downloadLink { display: none; margin-top: 20px; padding: 10px 20px; background-color: #555; color: white; text-decoration: none; border-radius: 5px; }
        #status { margin-top: 20px; font-size: 1.2em; color: #333; }
        #videoPreview { border: 1px solid #ccc; margin-top: 20px; max-width: 80%; height: auto; display: none; }
        .mic-controls select, .mic-controls button { padding: 8px 12px; font-size: 1em; border-radius: 5px; border: 1px solid #ccc; }
        #micMuteButton { background-color: #ff9800; color: white; border: none; cursor: pointer; }
        #micMuteButton:hover:not(:disabled) { background-color: #fb8c00; }
        #micMuteButton:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        #requestMicButton { background-color: #008CBA; color: white; padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 5px; }
        #requestMicButton:hover { background-color: #007bb5; }
        #audioProcessingControls label { cursor: pointer; user-select: none; }
        #audioProcessingControls input { vertical-align: middle; margin-right: 5px; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 10px; }
        .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: black; text-decoration: none; cursor: pointer; }
        #micSettingsButton { background-color: #008CBA; color: white; border: none; cursor: pointer; }
        #micSettingsButton:hover { background-color: #007bb5; }
    </style>
</head>
<body>
    <h1>Local Screen Recorder</h1>
    <button id="newRecordingButton" style="padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 5px; background-color: #4CAF50; color: white;" title="Set up a new recording">New Recording</button>
    <div id="recorderControls" style="display: none; text-align: center; width: 100%;">
        <div class="controls">
            <button id="startButton" title="Start Recording">Start Recording</button>
            <button id="pauseButton" disabled style="display: none;" title="Pause Recording">Pause</button>
            <button id="resumeButton" disabled style="display: none;" title="Resume Recording">Resume</button>
            <button id="stopButton" disabled style="display: none;" title="Stop Recording">Stop Recording</button>
            <button id="changeSourceButton" disabled style="display: none;" title="Change Screen/Tab">Change Source</button>
        </div>
        <div id="micControls" class="mic-controls" style="margin-top: 10px; display: none; align-items: center; gap: 10px;">
            <button id="micMuteButton" disabled title="Mute/Unmute Mic">Mute Mic</button>
            <button id="micSettingsButton">Microphone Settings</button>
        </div>
    </div>

    <div id="micSettingsDialog" class="modal">
      <div class="modal-content">
        <span id="closeMicSettings" class="close-button" role="button" aria-label="Close">&times;</span>
        <h2>Microphone Settings</h2>
        <div style="margin-bottom: 15px;">
            <label for="audioDeviceSelect">Microphone: </label>
            <select id="audioDeviceSelect" title="Select microphone"></select>
        </div>
        <div id="audioProcessingControls" style="font-size: 0.9em;">
            <p>Audio Enhancements:</p>
            <label style="display: block; margin-bottom: 5px;"><input type="checkbox" id="autoGainCheckbox" checked> Auto Gain Control</label>
            <label style="display: block; margin-bottom: 5px;"><input type="checkbox" id="noiseSuppressionCheckbox" checked> Noise Suppression</label>
            <label style="display: block;"><input type="checkbox" id="echoCancellationCheckbox" checked> Echo Cancellation</label>
        </div>
      </div>
    </div>

    <video id="videoPreview" autoplay muted></video>
    <a id="downloadLink" href="#" download="my-screen-recording.webm">Save Recording</a>
    <p id="status"></p>

    <script>
        const newRecordingButton = document.getElementById('newRecordingButton');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const pauseButton = document.getElementById('pauseButton');
        const resumeButton = document.getElementById('resumeButton');
        const changeSourceButton = document.getElementById('changeSourceButton');
        const downloadLink = document.getElementById('downloadLink');
        const statusDiv = document.getElementById('status');
        const videoPreview = document.getElementById('videoPreview');
        const audioDeviceSelect = document.getElementById('audioDeviceSelect');
        const micMuteButton = document.getElementById('micMuteButton');
        const recorderControls = document.getElementById('recorderControls');
        const micControls = document.getElementById('micControls');
        const micSettingsButton = document.getElementById('micSettingsButton');
        const micSettingsDialog = document.getElementById('micSettingsDialog');
        const closeMicSettings = document.getElementById('closeMicSettings');
        const autoGainCheckbox = document.getElementById('autoGainCheckbox');
        const noiseSuppressionCheckbox = document.getElementById('noiseSuppressionCheckbox');
        const echoCancellationCheckbox = document.getElementById('echoCancellationCheckbox');

        let mediaRecorder;
        let recordedChunks = [];
        let displayStream;
        let micStream;
        let mixedStream;
        let audioContext;
        let micSource;
        let gainNode;
        let compressorNode;
        let mediaStreamDestination;
        let isMicMuted = false;
        let hasMicAccess = false;

        // --- UI & Shortcut setup ---
        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
        const modifierKey = isMac ? 'Option' : 'Alt';
        newRecordingButton.title = `Set up a new recording (${modifierKey}+R)`;
        startButton.title = `Start Recording (${modifierKey}+R)`;
        pauseButton.title = `Pause Recording (${modifierKey}+P)`;
        resumeButton.title = `Resume Recording (${modifierKey}+P)`;
        stopButton.title = `Stop Recording (${modifierKey}+S)`;
        micMuteButton.title = `Mute/Unmute Mic (${modifierKey}+M)`;
        // --- End of UI & Shortcut setup ---

        async function setupAudioMixing(performCleanup = true) {
            if (performCleanup) {
                // Clean up existing audio context if it exists, as we are rebuilding the audio pipeline
                if (audioContext) {
                    audioContext.close().catch(e => console.error("Error closing previous audio context:", e));
                    audioContext = null;
                }

                // Remove any existing audio track from the mixed stream before adding a new one.
                const existingAudioTracks = mixedStream.getAudioTracks();
                existingAudioTracks.forEach(track => mixedStream.removeTrack(track));
            }

            const tabAudioTracks = displayStream.getAudioTracks();
            const micAudioTracks = micStream ? micStream.getAudioTracks() : [];
            let finalAudioTrack = null;

            if (micAudioTracks.length > 0 && tabAudioTracks.length > 0) {
                audioContext = new AudioContext();
                mediaStreamDestination = audioContext.createMediaStreamDestination();
                
                const tabSource = audioContext.createMediaStreamSource(new MediaStream([tabAudioTracks[0]]));
                const tabGainNode = audioContext.createGain();
                tabGainNode.gain.value = 0.7; // Reduce tab audio to make mic more prominent
                tabSource.connect(tabGainNode);
                tabGainNode.connect(mediaStreamDestination);

                micSource = audioContext.createMediaStreamSource(new MediaStream([micAudioTracks[0]]));
                gainNode = audioContext.createGain();
                gainNode.gain.value = 1.5; // Boost microphone volume
                micSource.connect(gainNode);

                if (autoGainCheckbox.checked) {
                    compressorNode = audioContext.createDynamicsCompressor();
                    compressorNode.threshold.value = -50;
                    compressorNode.knee.value = 40;
                    compressorNode.ratio.value = 12;
                    compressorNode.attack.value = 0.01;
                    compressorNode.release.value = 0.25;
                    gainNode.connect(compressorNode);
                    compressorNode.connect(mediaStreamDestination);
                } else {
                    gainNode.connect(mediaStreamDestination);
                }
                finalAudioTrack = mediaStreamDestination.stream.getAudioTracks()[0];
            } else if (tabAudioTracks.length > 0) {
                finalAudioTrack = tabAudioTracks[0];
            } else if (micAudioTracks.length > 0) {
                finalAudioTrack = micAudioTracks[0];
            }

            if (finalAudioTrack) {
                mixedStream.addTrack(finalAudioTrack);
            }
        }

        // Function to update button states
        function updateButtons(recording = false, paused = false) {
            startButton.disabled = recording;
            stopButton.disabled = !recording;
            changeSourceButton.disabled = !recording;
            pauseButton.disabled = !recording || paused;
            resumeButton.disabled = !recording || !paused;
            // micMuteButton is enabled once mic access is granted.
            micSettingsButton.disabled = recording;
            audioDeviceSelect.disabled = recording;
        }

        newRecordingButton.addEventListener('click', async () => {
            if (downloadLink.style.display === 'block') {
                if (!confirm('Starting a new recording will discard the current one if it is not saved. Are you sure?')) {
                    return;
                }
                // User confirmed, so clean up old recording UI before proceeding
                downloadLink.style.display = 'none';
                videoPreview.style.display = 'none';
                videoPreview.srcObject = null;
                videoPreview.src = '';
            }

            if (hasMicAccess) {
                // We already have permissions, just show the controls
                newRecordingButton.style.display = 'none';
                recorderControls.style.display = 'block';
                startButton.style.display = 'inline-block';
                stopButton.style.display = 'none';
                pauseButton.style.display = 'none';
                resumeButton.style.display = 'none';
                changeSourceButton.style.display = 'none';
                statusDiv.textContent = 'Ready to record. Adjust settings then click Start Recording.';
                updateButtons(false);
                return;
            }
            
            newRecordingButton.style.display = 'none';
            recorderControls.style.display = 'block';
            statusDiv.textContent = 'Requesting microphone access...';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());

                await populateAudioDevices();
                navigator.mediaDevices.ondevicechange = populateAudioDevices;
            
                micControls.style.display = 'inline-flex';
                micMuteButton.disabled = false;
                hasMicAccess = true;
                statusDiv.textContent = 'Ready to record. Adjust settings then click Start Recording.';
            } catch (err) {
                console.error('Error getting microphone permission:', err);
                await populateAudioDevices();
                micControls.style.display = 'inline-flex';
                hasMicAccess = true; // Set to true to not ask again this session.
                statusDiv.textContent = `Could not get mic: ${err.name}. You can still record your screen.`;
            }
        });

        micSettingsButton.addEventListener('click', () => {
            micSettingsDialog.style.display = 'block';
        });

        closeMicSettings.addEventListener('click', () => {
            micSettingsDialog.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target == micSettingsDialog) {
                micSettingsDialog.style.display = 'none';
            }
        });

        async function populateAudioDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioDevices = devices.filter(device => device.kind === 'audioinput');
                
                const currentSelection = audioDeviceSelect.value;
                audioDeviceSelect.innerHTML = ''; // Clear existing options
                
                audioDevices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Microphone ${audioDeviceSelect.length + 1}`;
                    audioDeviceSelect.appendChild(option);
                });
                
                // Add option for no microphone
                const noMicOption = document.createElement('option');
                noMicOption.value = 'none';
                noMicOption.text = 'No Microphone';
                audioDeviceSelect.appendChild(noMicOption);
                
                // Restore selection if possible, otherwise default to the first device
                if (Array.from(audioDeviceSelect.options).some(o => o.value === currentSelection) && currentSelection) {
                    audioDeviceSelect.value = currentSelection;
                } else if (audioDevices.length > 0) {
                    audioDeviceSelect.value = audioDevices[0].deviceId;
                } else {
                    audioDeviceSelect.value = 'none';
                }

            } catch (err) {
                console.error('Could not enumerate audio devices:', err);
                audioDeviceSelect.innerHTML = '<option value="none">Could not access microphones</option>';
            }
        }
        

        micMuteButton.addEventListener('click', () => {
            isMicMuted = !isMicMuted;
            micMuteButton.textContent = isMicMuted ? 'Unmute Mic' : 'Mute Mic';

            // If recording is active, apply immediately
            if (micStream && micStream.getAudioTracks().length > 0) {
                micStream.getAudioTracks()[0].enabled = !isMicMuted;
            }
        });

        async function applyAudioConstraint(constraint, element) {
            // Handle custom AGC via Web Audio API
            if (constraint === 'autoGainControl') {
                if (!audioContext || !micSource || !gainNode || !mediaStreamDestination) return;
                
                if (element.checked) {
                    // Enable compressor
                    if (!compressorNode) {
                        // Settings for a vocal leveler/compressor. This provides AGC.
                        // It keeps the voice level consistent, even when moving away from the mic.
                        compressorNode = audioContext.createDynamicsCompressor();
                        compressorNode.threshold.value = -50; // Start compressing even at low volumes
                        compressorNode.knee.value = 40;      // Soft knee for a gradual, less noticeable effect
                        compressorNode.ratio.value = 12;     // A common ratio for leveling vocals
                        compressorNode.attack.value = 0.01;  // Faster attack to catch sounds quickly
                        compressorNode.release.value = 0.25; // Standard release time
                    }
                    gainNode.disconnect();
                    gainNode.connect(compressorNode);
                    compressorNode.connect(mediaStreamDestination);
                    console.log('Custom AGC enabled');
                } else {
                    // Disable compressor by bypassing it
                    gainNode.disconnect();
                    gainNode.connect(mediaStreamDestination);
                    console.log('Custom AGC disabled');
                }
                return;
            }

            // Handle other constraints via standard track applyConstraints
            if (!micStream) return;
            const [track] = micStream.getAudioTracks();
            if (track) {
                try {
                    await track.applyConstraints({ [constraint]: element.checked });
                    console.log(`Applied constraint: ${constraint} = ${element.checked}`);
                } catch (err) {
                    // Note: Not all constraints can be changed live. This may fail silently on some browsers.
                    console.error(`Error applying constraint ${constraint}:`, err);
                    statusDiv.textContent = `Error: Could not apply '${constraint}'. Reverting.`;
                    element.checked = !element.checked; // Revert checkbox on failure
                }
            }
        }

        autoGainCheckbox.addEventListener('change', (e) => applyAudioConstraint('autoGainControl', e.target));
        noiseSuppressionCheckbox.addEventListener('change', (e) => applyAudioConstraint('noiseSuppression', e.target));
        echoCancellationCheckbox.addEventListener('change', (e) => applyAudioConstraint('echoCancellation', e.target));

        startButton.addEventListener('click', async () => {
            // Start the screen recording
            recordedChunks = [];
            micStream = null; // Reset mic stream
            downloadLink.style.display = 'none';
            statusDiv.textContent = 'Awaiting screen selection...';
            videoPreview.style.display = 'none';
            videoPreview.controls = false;
            videoPreview.muted = true;

            try {
                const selectedAudioDeviceId = audioDeviceSelect.value;
                if (selectedAudioDeviceId !== 'none') {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            deviceId: { exact: selectedAudioDeviceId },
                            autoGainControl: false, // Use our own custom AGC instead
                            noiseSuppression: noiseSuppressionCheckbox.checked,
                            echoCancellation: echoCancellationCheckbox.checked
                        }
                    });
                    if (micStream) {
                        micStream.getAudioTracks()[0].enabled = !isMicMuted;
                    }
                }

                // Get screen and tab audio
                displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: "always",
                        displaySurface: "browser",
                    },
                    audio: {
                        // High-quality tab audio
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    },
                });
                
                const tracks = [...displayStream.getVideoTracks()];
                mixedStream = new MediaStream(tracks);
                await setupAudioMixing();

                // When the user stops sharing via the browser's native UI, stop the recording
                displayStream.getVideoTracks()[0].onended = () => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        stopButton.click();
                    }
                };

                // Preview the screen, but without audio to prevent feedback
                videoPreview.srcObject = displayStream;
                videoPreview.style.display = 'block';

                mediaRecorder = new MediaRecorder(mixedStream, {
                    mimeType: 'video/webm;codecs=vp9,opus', // Use VP9 for better quality
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, {
                        type: 'video/webm'
                    });
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.style.display = 'block';
                    statusDiv.textContent = 'Recording finished. Watch below or click to save.';

                    // Stop all tracks from all streams
                    displayStream.getTracks().forEach(track => track.stop());
                    if (micStream) {
                        micStream.getTracks().forEach(track => track.stop());
                    }
                    if (audioContext) {
                        audioContext.close();
                    }

                    videoPreview.style.display = 'block';
                    videoPreview.srcObject = null; // Stop the live preview
                    videoPreview.src = url;
                    videoPreview.muted = false;
                    videoPreview.autoplay = false;
                    videoPreview.controls = true;
                    
                    recorderControls.style.display = 'none';
                    changeSourceButton.style.display = 'none';
                    newRecordingButton.style.display = 'inline-block';
                };

                mediaRecorder.onpause = () => {
                    statusDiv.textContent = 'Recording paused.';
                    updateButtons(true, true);
                    pauseButton.style.display = 'none';
                    resumeButton.style.display = 'inline-block';
                };

                mediaRecorder.onresume = () => {
                    statusDiv.textContent = 'Recording resumed.';
                    updateButtons(true, false);
                    pauseButton.style.display = 'inline-block';
                    resumeButton.style.display = 'none';
                };

                mediaRecorder.start();
                statusDiv.textContent = 'Recording...';
                micMuteButton.textContent = 'Mute Mic';
                updateButtons(true, false);

                startButton.style.display = 'none';
                stopButton.style.display = 'inline-block';
                pauseButton.style.display = 'inline-block';
                changeSourceButton.style.display = 'inline-block';

            } catch (err) {
                console.error('Error starting recording:', err);
                let message = `Error starting recording: ${err.name} - ${err.message}`;
                if (err.name === 'NotAllowedError') {
                    message = 'Permission to access screen was denied. Please try again and allow access.';
                } else if (err.name === 'NotFoundError') {
                    message = 'No display media found. Please ensure you have a screen to share.';
                } else if (err.name === 'OverconstrainedError') {
                    message = `Error with microphone selection: ${err.message}. The selected device may be unavailable. Please try another device.`;
                }
                statusDiv.textContent = message;
                updateButtons(false);
                startButton.style.display = 'inline-block';
                stopButton.style.display = 'none';
                pauseButton.style.display = 'none';
                resumeButton.style.display = 'none';
                // Also clean up any partial streams
                if (displayStream) displayStream.getTracks().forEach(track => track.stop());
                if (micStream) micStream.getTracks().forEach(track => track.stop());
            }
        });

        pauseButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
            }
        });

        resumeButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
            }
        });

        stopButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        });

        changeSourceButton.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

            const oldVideoTrack = displayStream.getVideoTracks()[0];
            if (!oldVideoTrack) return;

            // Temporarily remove the handler to prevent it from firing during the switch.
            const originalOnEnded = oldVideoTrack.onended;
            oldVideoTrack.onended = null;

            statusDiv.textContent = 'Awaiting new screen selection...';
            try {
                const newDisplayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always", displaySurface: "browser" },
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                });

                // --- Video track replacement ---
                const newVideoTrack = newDisplayStream.getVideoTracks()[0];
                
                mixedStream.removeTrack(oldVideoTrack);
                mixedStream.addTrack(newVideoTrack);
                
                const oldDisplayStream = displayStream;
                displayStream = newDisplayStream;

                const oldAudioContext = audioContext;
                const oldAudioTracks = mixedStream.getAudioTracks();

                // Re-run audio setup for the new stream's audio, without cleanup.
                // This creates a new audio context and adds a new track to the mixed stream.
                await setupAudioMixing(false);

                // Now that the new audio track is in the mixed stream, we can remove the old ones.
                oldAudioTracks.forEach(track => mixedStream.removeTrack(track));
                
                // It is now safe to close the old audio context.
                if (oldAudioContext) {
                    oldAudioContext.close().catch(e => console.error("Error closing old audio context", e));
                }

                // Now that the old display stream's tracks are no longer in mixedStream,
                // we can safely stop them.
                oldDisplayStream.getTracks().forEach(track => track.stop());

                // Update the live preview.
                videoPreview.srcObject = newDisplayStream;

                // Attach the original 'onended' handler logic to the new track.
                newVideoTrack.onended = originalOnEnded;

                statusDiv.textContent = 'Recording source updated.';

            } catch (err) {
                console.error('Error changing screen source:', err);
                statusDiv.textContent = 'Could not change source: ' + err.message;
                // If the operation was cancelled or failed, restore the handler on the original track.
                if (oldVideoTrack.readyState === 'live') {
                    oldVideoTrack.onended = originalOnEnded;
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            // Modal shortcuts
            if (e.key === 'Escape' && micSettingsDialog.style.display === 'block') {
                micSettingsDialog.style.display = 'none';
                return;
            }

            // Playback shortcuts (only when video is visible and has a source)
            if (videoPreview.src && videoPreview.style.display !== 'none' && videoPreview.controls) {
                 if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'TEXTAREA') {
                    return; // Don't interfere with typing in inputs
                }

                let playbackHandled = true;
                // Use e.code to make shortcuts independent of keyboard layout and modifiers (like Shift)
                switch (e.code) {
                    case 'Space': // play/pause
                        if (videoPreview.paused) videoPreview.play();
                        else videoPreview.pause();
                        break;
                    case 'ArrowLeft':
                        videoPreview.currentTime = Math.max(0, videoPreview.currentTime - 5);
                        break;
                    case 'ArrowRight':
                        videoPreview.currentTime = Math.min(videoPreview.duration, videoPreview.currentTime + 5);
                        break;
                    case 'ArrowUp':
                        videoPreview.volume = Math.min(1, videoPreview.volume + 0.1);
                        break;
                    case 'ArrowDown':
                        videoPreview.volume = Math.max(0, videoPreview.volume - 0.1);
                        break;
                    case 'Comma': // Corresponds to '<' or ',' key
                        videoPreview.playbackRate = Math.max(0.25, videoPreview.playbackRate - 0.25);
                        break;
                    case 'Period': // Corresponds to '>' or '.' key
                        videoPreview.playbackRate = Math.min(2, videoPreview.playbackRate + 0.25);
                        break;
                    default:
                        playbackHandled = false;
                }
                if (playbackHandled) {
                    e.preventDefault();
                    return; // Stop further processing
                }
            }

            // Global control shortcuts (using Alt to avoid conflicts)
            if (e.altKey) {
                let controlHandled = true;
                switch (e.code) {
                    case 'KeyR':
                        if (newRecordingButton.style.display !== 'none') {
                            newRecordingButton.click();
                        } else if (!startButton.disabled) {
                            startButton.click();
                        }
                        break;
                    case 'KeyS':
                        if (!stopButton.disabled) stopButton.click();
                        break;
                    case 'KeyP':
                        if (!pauseButton.disabled) pauseButton.click();
                        else if (!resumeButton.disabled) resumeButton.click();
                        break;
                    case 'KeyM':
                        if (!micMuteButton.disabled) micMuteButton.click();
                        break;
                    default:
                        controlHandled = false;
                }
                if (controlHandled) {
                    e.preventDefault();
                }
            }
        });
    </script>
