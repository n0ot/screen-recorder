<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Screen Recorder</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f4f4f4; }
        .controls button { margin: 10px; padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 5px; transition: background-color 0.3s; }
        #startButton { background-color: #4CAF50; color: white; }
        #startButton:hover { background-color: #45a049; }
        #stopButton { background-color: #f44336; color: white; }
        #stopButton:hover { background-color: #da190b; }
        #pauseButton, #resumeButton { background-color: #008CBA; color: white; }
        #pauseButton:hover, #resumeButton:hover { background-color: #007bb5; }
        #downloadLink { display: none; margin-top: 20px; padding: 10px 20px; background-color: #555; color: white; text-decoration: none; border-radius: 5px; }
        #status { margin-top: 20px; font-size: 1.2em; color: #333; }
        #videoPreview { border: 1px solid #ccc; margin-top: 20px; max-width: 80%; height: auto; display: none; }
        .mic-controls select, .mic-controls button { padding: 8px 12px; font-size: 1em; border-radius: 5px; border: 1px solid #ccc; }
        #micMuteButton { background-color: #ff9800; color: white; border: none; cursor: pointer; }
        #micMuteButton:hover:not(:disabled) { background-color: #fb8c00; }
        #micMuteButton:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        #requestMicButton { background-color: #008CBA; color: white; padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 5px; }
        #requestMicButton:hover { background-color: #007bb5; }
        #audioProcessingControls label { cursor: pointer; user-select: none; }
        #audioProcessingControls input { vertical-align: middle; margin-right: 5px; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 10px; }
        .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: black; text-decoration: none; cursor: pointer; }
        #micSettingsButton { background-color: #008CBA; color: white; border: none; cursor: pointer; }
        #micSettingsButton:hover { background-color: #007bb5; }
    </style>
</head>
<body>
    <h1>Local Screen Recorder</h1>
    <button id="requestMicButton">Grant Microphone Access</button>
    <div id="recorderControls" style="display: none; text-align: center; width: 100%;">
        <div class="controls">
            <button id="startButton">Start Recording</button>
            <button id="pauseButton" disabled>Pause</button>
            <button id="resumeButton" disabled>Resume</button>
            <button id="stopButton" disabled>Stop Recording</button>
        </div>
        <div class="mic-controls" style="margin-top: 10px; display: inline-flex; align-items: center; gap: 10px;">
            <button id="micMuteButton" disabled>Mute Mic</button>
            <button id="micSettingsButton">Microphone Settings</button>
        </div>
    </div>

    <div id="micSettingsDialog" class="modal">
      <div class="modal-content">
        <span id="closeMicSettings" class="close-button">&times;</span>
        <h2>Microphone Settings</h2>
        <div style="margin-bottom: 15px;">
            <label for="audioDeviceSelect">Microphone: </label>
            <select id="audioDeviceSelect" title="Select microphone"></select>
        </div>
        <div id="audioProcessingControls" style="font-size: 0.9em;">
            <p>Audio Enhancements:</p>
            <label style="display: block; margin-bottom: 5px;"><input type="checkbox" id="autoGainCheckbox" checked> Auto Gain Control</label>
            <label style="display: block; margin-bottom: 5px;"><input type="checkbox" id="noiseSuppressionCheckbox" checked> Noise Suppression</label>
            <label style="display: block;"><input type="checkbox" id="echoCancellationCheckbox" checked> Echo Cancellation</label>
        </div>
      </div>
    </div>

    <video id="videoPreview" autoplay muted></video>
    <a id="downloadLink" href="#" download="my-screen-recording.webm">Download Video</a>
    <p id="status"></p>

    <script>
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const pauseButton = document.getElementById('pauseButton');
        const resumeButton = document.getElementById('resumeButton');
        const downloadLink = document.getElementById('downloadLink');
        const statusDiv = document.getElementById('status');
        const videoPreview = document.getElementById('videoPreview');
        const audioDeviceSelect = document.getElementById('audioDeviceSelect');
        const micMuteButton = document.getElementById('micMuteButton');
        const requestMicButton = document.getElementById('requestMicButton');
        const recorderControls = document.getElementById('recorderControls');
        const micSettingsButton = document.getElementById('micSettingsButton');
        const micSettingsDialog = document.getElementById('micSettingsDialog');
        const closeMicSettings = document.getElementById('closeMicSettings');
        const autoGainCheckbox = document.getElementById('autoGainCheckbox');
        const noiseSuppressionCheckbox = document.getElementById('noiseSuppressionCheckbox');
        const echoCancellationCheckbox = document.getElementById('echoCancellationCheckbox');

        let mediaRecorder;
        let recordedChunks = [];
        let displayStream;
        let micStream;
        let mixedStream;
        let audioContext;
        let micSource;
        let gainNode;
        let compressorNode;
        let mediaStreamDestination;
        let isMicMuted = false;

        // Function to update button states
        function updateButtons(recording = false, paused = false) {
            startButton.disabled = recording;
            stopButton.disabled = !recording;
            pauseButton.disabled = !recording || paused;
            resumeButton.disabled = !recording || !paused;
            // micMuteButton is enabled once mic access is granted.
            micSettingsButton.disabled = recording;
            audioDeviceSelect.disabled = recording;
        }

        // Initial button state
        updateButtons(false);

        micSettingsButton.addEventListener('click', () => {
            micSettingsDialog.style.display = 'block';
        });

        closeMicSettings.addEventListener('click', () => {
            micSettingsDialog.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target == micSettingsDialog) {
                micSettingsDialog.style.display = 'none';
            }
        });

        requestMicButton.addEventListener('click', async () => {
            requestMicButton.disabled = true;
            statusDiv.textContent = 'Requesting microphone access...';
            try {
                // Request access to get the device list with labels
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // We don't need this stream now, so stop it.
                stream.getTracks().forEach(track => track.stop());

                await populateAudioDevices();
                // Listen for device changes from now on
                navigator.mediaDevices.ondevicechange = populateAudioDevices;

                requestMicButton.style.display = 'none';
                recorderControls.style.display = 'block';
                statusDiv.textContent = 'Ready. Select your microphone and start recording.';
                micMuteButton.disabled = false;
            } catch (err) {
                console.error('Error getting microphone permission:', err);
                statusDiv.textContent = `Could not get microphone permission: ${err.name}. Please check your browser settings.`;
                requestMicButton.disabled = false;
            }
        });

        async function populateAudioDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioDevices = devices.filter(device => device.kind === 'audioinput');
                
                const currentSelection = audioDeviceSelect.value;
                audioDeviceSelect.innerHTML = ''; // Clear existing options
                
                audioDevices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Microphone ${audioDeviceSelect.length + 1}`;
                    audioDeviceSelect.appendChild(option);
                });
                
                // Add option for no microphone
                const noMicOption = document.createElement('option');
                noMicOption.value = 'none';
                noMicOption.text = 'No Microphone';
                audioDeviceSelect.appendChild(noMicOption);
                
                // Restore selection if possible, otherwise default to the first device
                if (Array.from(audioDeviceSelect.options).some(o => o.value === currentSelection) && currentSelection) {
                    audioDeviceSelect.value = currentSelection;
                } else if (audioDevices.length > 0) {
                    audioDeviceSelect.value = audioDevices[0].deviceId;
                } else {
                    audioDeviceSelect.value = 'none';
                }

            } catch (err) {
                console.error('Could not enumerate audio devices:', err);
                audioDeviceSelect.innerHTML = '<option value="none">Could not access microphones</option>';
            }
        }
        

        micMuteButton.addEventListener('click', () => {
            isMicMuted = !isMicMuted;
            micMuteButton.textContent = isMicMuted ? 'Unmute Mic' : 'Mute Mic';

            // If recording is active, apply immediately
            if (micStream && micStream.getAudioTracks().length > 0) {
                micStream.getAudioTracks()[0].enabled = !isMicMuted;
            }
        });

        async function applyAudioConstraint(constraint, element) {
            // Handle custom AGC via Web Audio API
            if (constraint === 'autoGainControl') {
                if (!audioContext || !micSource || !gainNode || !mediaStreamDestination) return;
                
                if (element.checked) {
                    // Enable compressor
                    if (!compressorNode) {
                        // Settings for a vocal leveler/compressor. This provides AGC.
                        // It keeps the voice level consistent, even when moving away from the mic.
                        compressorNode = audioContext.createDynamicsCompressor();
                        compressorNode.threshold.value = -50; // Start compressing even at low volumes
                        compressorNode.knee.value = 40;      // Soft knee for a gradual, less noticeable effect
                        compressorNode.ratio.value = 12;     // A common ratio for leveling vocals
                        compressorNode.attack.value = 0.01;  // Faster attack to catch sounds quickly
                        compressorNode.release.value = 0.25; // Standard release time
                    }
                    gainNode.disconnect();
                    gainNode.connect(compressorNode);
                    compressorNode.connect(mediaStreamDestination);
                    console.log('Custom AGC enabled');
                } else {
                    // Disable compressor by bypassing it
                    gainNode.disconnect();
                    gainNode.connect(mediaStreamDestination);
                    console.log('Custom AGC disabled');
                }
                return;
            }

            // Handle other constraints via standard track applyConstraints
            if (!micStream) return;
            const [track] = micStream.getAudioTracks();
            if (track) {
                try {
                    await track.applyConstraints({ [constraint]: element.checked });
                    console.log(`Applied constraint: ${constraint} = ${element.checked}`);
                } catch (err) {
                    // Note: Not all constraints can be changed live. This may fail silently on some browsers.
                    console.error(`Error applying constraint ${constraint}:`, err);
                    statusDiv.textContent = `Error: Could not apply '${constraint}'. Reverting.`;
                    element.checked = !element.checked; // Revert checkbox on failure
                }
            }
        }

        autoGainCheckbox.addEventListener('change', (e) => applyAudioConstraint('autoGainControl', e.target));
        noiseSuppressionCheckbox.addEventListener('change', (e) => applyAudioConstraint('noiseSuppression', e.target));
        echoCancellationCheckbox.addEventListener('change', (e) => applyAudioConstraint('echoCancellation', e.target));

        startButton.addEventListener('click', async () => {
            recordedChunks = [];
            micStream = null; // Reset mic stream
            downloadLink.style.display = 'none';
            statusDiv.textContent = 'Awaiting permission...';
            videoPreview.style.display = 'none';

            try {
                const selectedAudioDeviceId = audioDeviceSelect.value;
                if (selectedAudioDeviceId !== 'none') {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            deviceId: { exact: selectedAudioDeviceId },
                            autoGainControl: false, // Use our own custom AGC instead
                            noiseSuppression: noiseSuppressionCheckbox.checked,
                            echoCancellation: echoCancellationCheckbox.checked
                        }
                    });
                    if (micStream) {
                        micStream.getAudioTracks()[0].enabled = !isMicMuted;
                    }
                }

                // Get screen and tab audio
                displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: "always",
                        displaySurface: "browser",
                    },
                    audio: {
                        // High-quality tab audio
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    },
                });
                
                const tracks = [...displayStream.getVideoTracks()];
                const tabAudioTracks = displayStream.getAudioTracks();
                const micAudioTracks = micStream ? micStream.getAudioTracks() : [];

                if (micAudioTracks.length > 0 && tabAudioTracks.length > 0) {
                    audioContext = new AudioContext();
                    mediaStreamDestination = audioContext.createMediaStreamDestination();
                    
                    const tabSource = audioContext.createMediaStreamSource(new MediaStream([tabAudioTracks[0]]));
                    const tabGainNode = audioContext.createGain();
                    tabGainNode.gain.value = 0.7; // Reduce tab audio volume to 70% to make mic more prominent
                    tabSource.connect(tabGainNode);
                    tabGainNode.connect(mediaStreamDestination);

                    micSource = audioContext.createMediaStreamSource(new MediaStream([micAudioTracks[0]]));
                    gainNode = audioContext.createGain();
                    gainNode.gain.value = 1.5; // Boost microphone volume by 50%
                    micSource.connect(gainNode);

                    if (autoGainCheckbox.checked) {
                        // Settings for a vocal leveler/compressor. This provides AGC.
                        // It keeps the voice level consistent, even when moving away from the mic.
                        compressorNode = audioContext.createDynamicsCompressor();
                        compressorNode.threshold.value = -50; // Start compressing even at low volumes
                        compressorNode.knee.value = 40;      // Soft knee for a gradual, less noticeable effect
                        compressorNode.ratio.value = 12;     // A common ratio for leveling vocals
                        compressorNode.attack.value = 0.01;  // Faster attack to catch sounds quickly
                        compressorNode.release.value = 0.25; // Standard release time
                        gainNode.connect(compressorNode);
                        compressorNode.connect(mediaStreamDestination);
                    } else {
                        gainNode.connect(mediaStreamDestination);
                    }

                    tracks.push(mediaStreamDestination.stream.getAudioTracks()[0]);
                } else if (tabAudioTracks.length > 0) {
                    tracks.push(tabAudioTracks[0]);
                } else if (micAudioTracks.length > 0) {
                    tracks.push(micAudioTracks[0]);
                }
                
                mixedStream = new MediaStream(tracks);

                // Preview the screen, but without audio to prevent feedback
                videoPreview.srcObject = displayStream;
                videoPreview.style.display = 'block';

                mediaRecorder = new MediaRecorder(mixedStream, {
                    mimeType: 'video/webm;codecs=vp9,opus', // Use VP9 for better quality
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, {
                        type: 'video/webm'
                    });
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.style.display = 'block';
                    statusDiv.textContent = 'Recording finished. Watch below or click to download.';

                    // Stop all tracks from all streams
                    displayStream.getTracks().forEach(track => track.stop());
                    if (micStream) {
                        micStream.getTracks().forEach(track => track.stop());
                    }
                    if (audioContext) {
                        audioContext.close();
                    }

                    videoPreview.style.display = 'block';
                    videoPreview.srcObject = null; // Stop the live preview
                    videoPreview.src = url;
                    videoPreview.muted = false;
                    videoPreview.autoplay = false;
                    videoPreview.controls = true;
                    updateButtons(false);
                };

                mediaRecorder.onpause = () => {
                    statusDiv.textContent = 'Recording paused.';
                    updateButtons(true, true);
                };

                mediaRecorder.onresume = () => {
                    statusDiv.textContent = 'Recording resumed.';
                    updateButtons(true, false);
                };

                mediaRecorder.start();
                statusDiv.textContent = 'Recording...';
                micMuteButton.textContent = 'Mute Mic';
                updateButtons(true, false);

            } catch (err) {
                console.error('Error starting recording:', err);
                let message = `Error starting recording: ${err.name} - ${err.message}`;
                if (err.name === 'NotAllowedError') {
                    message = 'Permission to access screen was denied. Please try again and allow access.';
                } else if (err.name === 'NotFoundError') {
                    message = 'No display media found. Please ensure you have a screen to share.';
                } else if (err.name === 'OverconstrainedError') {
                    message = `Error with microphone selection: ${err.message}. The selected device may be unavailable. Please try another device.`;
                }
                statusDiv.textContent = message;
                updateButtons(false);
                // Also clean up any partial streams
                if (displayStream) displayStream.getTracks().forEach(track => track.stop());
                if (micStream) micStream.getTracks().forEach(track => track.stop());
            }
        });

        pauseButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
            }
        });

        resumeButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
            }
        });

        stopButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        });
    </script>
</body>
</html>
